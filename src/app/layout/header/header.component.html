<nav class="navbar navbar-expand-lg navbar-light ">
  <div class="container">
      <a class="navbar-brand" [routerLink]="['/']">
          <img src="../../../assets/images/Left.png" alt="logo" height="30">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
              <li class="nav-item">
                  <a class="nav-link" [routerLink]="['']">Accueil</a>
              </li>
              <li class="nav-item">
                  <a class="nav-link" [routerLink]="['/solutions']">Solutions</a>
              </li>
              <li class="nav-item">
                  <a class="nav-link" [routerLink]="['/contact']">Contact</a>
              </li>
          </ul>
      </div>

      <div class="d-flex align-items-center">
          <ng-container *ngIf="isAuthenticated; else loginLink">
              <span class="navbar-text">Bienvenue, <strong class="text-success">{{ username }} </strong></span>
              <button class="btn btn-outline-secondary ms-3" (click)="openModal()">  <i class="fas fa-sign-out"></i></button>
          </ng-container>
          <ng-template #loginLink>
              <a class="btn btn-outline-success" [routerLink]="['/auth']">Se connecter</a>
          </ng-template>
      </div>
  </div>
</nav>

<!-- Modal de confirmation de déconnexion -->
<div *ngIf="showModal" class="modal-overlay">
  <div class="modal-content">
      <h3>Confirmation de déconnexion</h3>
      <p>Êtes-vous sûr de vouloir vous déconnecter ?</p>
      <button class="btn btn-success" (click)="logout()">Oui</button>
      <button class="btn btn-secondary" (click)="closeModal()">Annuler</button>
  </div>
</div>
